# SPDX-License-Identifier: GPL-3.0-or-later
# Vérifie que toutes les dépendances ont une licence compatible avec la GPL v3
# et qu'aucune n'a de vulnérabilité connue.
[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
