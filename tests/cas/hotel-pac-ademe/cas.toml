description = "Établissement d'accueil de la petite enfance (usage 12) de plain-pied, 400 m² utiles en une zone et un groupe (25 m × 16 m, 3,4 m de haut, 80 m² de baies à volets motorisés), sur la météo ouverte ADEME (station de Tours, zone H2b) : ventilation simple flux par extraction (2 000 m³/h en occupation avec détection d'utilisation, Crdbnr = 0,9 ; 300 m³/h en inoccupation ; 600 W puis 90 W), plancher chauffant à eau (classe A, 5 m³/h, 35 °C au départ de dimensionnement) alimenté par huit pompes à chaleur air extérieur / eau identiques à celle de l'exemple maison-plancher-ademe (Rdim = 8) et un appoint électrique de 15 kW, deux chauffe-eau électriques de 100 L sans réseau intergroupe, éclairage par locaux du tableau 78 de l'usage 12 aux parts du classeur des scénarios (salle de jeux avec gradation et détection d'absence). Exigences d'un permis déposé en septembre 2026 (usage soumis à partir du 1er mai 2026), catégorie 1, BR1. Valeurs de saisie illustratives. Résultat non réglementaire."
