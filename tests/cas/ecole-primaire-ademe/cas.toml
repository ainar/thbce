description = "École primaire (usage 4) R+1 de 1 500 m² utiles en une zone et un groupe (emprise de 50 m × 15 m, 7,4 m de haut, 300 m² de baies à stores enroulables extérieurs manuels non motorisés), sur la météo ouverte ADEME (station de Nancy, zone H1b, Meurthe-et-Moselle, 210 m) : ventilation simple flux par extraction (7 000 m³/h en occupation avec sondes de CO2, Crdbnr = 0,8 ; 700 m³/h en inoccupation ; ventilateur de 2 100 W puis 210 W), chaudière gaz à condensation de 150 kW et radiateurs à eau, ECS par un ballon électrique de 300 L sur une boucle de 80 m (60 W de circulateurs arrêtés pendant les vacances scolaires, « Typegest_circ-e = 1 » ; boucle et production d'ECS à l'arrêt pendant les vacances, éq. 47, 1736 et 1007), éclairage par locaux du tableau 78 de l'usage 4 aux parts du classeur des scénarios : salles de classe à 7 W/m² avec gradation, détection d'absence et gestion fractionnée, bureaux, salle de réunion et salle de repos sur interrupteur, circulations et sanitaires-vestiaires à détection de présence. Ni ascenseur ni parking. Exigences d'un permis déposé en 2025, catégorie 1 de contraintes extérieures, classe de bruit BR1. Valeurs de saisie illustratives. Résultat non réglementaire."
source = "aucune : valeurs du moteur au lot 0c1 (18 novembre 2026), figées pour détecter les régressions ; ce n'est pas un cas de référence. Recoupements à la main (test `ecole_et_creche_a_la_main` de crates/thbce-io/tests/enseignement.rs) : surface de référence 1 500 m² (SU, éq. 2376) ; débits conventionnels du Bbio 7,2 × 1 500 = 10 800 m³/h en occupation (tableau 56-1) ; forfait de refroidissement 0,016 × (900 − 350) × 1,0 / 2,3 × 1 500 = 5 739,1 kWh (éq. 2493, tableau 335, DH_max 900 °C.h) ; boucle d'ECS en service hors des 1 536 h de vacances de l'usage 4 (éq. 47 et 1736) : circulateurs 0,060 × 7 224 = 433,4 kWh (éq. 1747), pertes 0,25 × 80 × (50,5 − 20) = 610 W, soit 4 406,6 kWh (éq. 1744)."
