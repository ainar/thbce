description = "Variante de tests/cas/maison-chaudiere-gaz-ademe (plancher chauffant à eau, ballon d'ECS de 200 L) où la chaudière est remplacée par deux pompes à chaleur à absorption au gaz (GAHP, §8.24, type 504), une machine par mode (« Idfougen ») : en chauffage, GAHP air/eau classique, GUE pivot déclaré 1,5 à 7 °C extérieur et 45 °C aval, soit min(0,8 × 1,5 ; 1,51) = 1,2 utile, 12 kW de gaz au pivot ; en ECS, GAHP air/eau base du ballon (échangeur à mi-hauteur de la zone basse), GUE pivot par défaut 0,8 × 1,13, 8 kW de gaz au pivot. Valeurs par défaut de la fiche, signalées : brûleur tout ou rien (Q137), pas d'échangeur sur les fumées, auxiliaires au pivot max(500 W ; 5 % du gaz), Paux0, Pertes40°C et rendement de combustion selon la puissance fournie au pivot (Q136), Dfou0 de 26 min en ECS (Q135). Les pertes à l'arrêt ramenées au gaz (éq. 1345, Q139) pèsent lourd à faible charge, surtout en ECS. Valeurs de saisie illustratives. Résultat non réglementaire."
source = "aucune : calcul du moteur, fiche 8.24 relue sur les p. 822 à 889 de l'annexe III (lectures Q135 à Q139). Ce n'est pas un cas de référence."
meteo = "ademe"
