description = "Variante de tests/cas/maison-pac-geothermie-ademe (PAC eau glycolée / eau sur sondes, plancher chauffant, météo ouverte ADEME, Tours, H2b) rendue climatisée : le plancher est aussi rafraîchissant (classe A, réseau hydraulique de froid à départ constant de 18 °C, écart −3 K), alimenté par une génération de froid en cascade dont le premier générateur est un échangeur de géocooling (fiche 8.30 : 0,7 m³/h et Δθ 3 K côté bâtiment, 0,8 m³/h et Δθ 3 K côté sondes, UA 800 W/K, retour source limité à 16 °C, circulateur primaire de 20 W, association « base et complément ») sur ses propres sondes (sol de 11 à 14 °C, 100 m, pompes de 60 W à la demande), complété par un refroidisseur air extérieur / eau (EER déclaré 3,5 au pivot, 1 kW absorbé). Valeurs de saisie illustratives. Résultat non réglementaire."
source = "aucune : le Bbio est celui de la maison d'exemple, le calcul du Bbio ne dépendant pas des systèmes (§8.1.3.1). Ce n'est pas un cas de référence."
