description = "Variante de l'exemple `bureaux-cta-ademe` (usage 3, 1 000 m², une zone, un groupe non climatisé ; centrale de prétraitement à débit constant, type 2 ; météo ouverte ADEME, Tours, zone H2b) dotée d'un humidificateur d'hiver à vapeur (consigne 6 g/kg d'air sec, énergie fournie par la chaudière gaz par un réseau de CTA fictif, §6.3.3.4.9.2 et éq. 939) et d'un rafraîchissement évaporatif indirect sur l'air extrait (θi_base = 24 °C, rendement conventionnel 0,8 ; §6.3.3.4.2 et 6.3.3.4.5.3). Reste de la saisie identique. Valeurs de saisie illustratives. Résultat non réglementaire."
source = "aucune : valeurs du moteur au lot 1-ven3 (18 novembre 2026), figées pour détecter les régressions ; ce n'est pas un cas de référence. Recoupements : fonctions de l'humidification et du rafraîchissement évaporatif vérifiées à la main (tests de `crates/thbce-core/src/ventilation/humidification.rs`) ; Bbio identique à l'exemple de départ (système conventionnel du §6.1) ; énergie de l'humidificateur ajoutée à la demande de la chaudière (22 974,7 → 29 239,8 kWh pour 6 295,8 kWh d'humidification) ; rafraîchissement indirect autorisé 1 464 h en calcul des consommations et 2 490 h en calcul du confort d'été (saison équivalente de l'éq. 411, groupe non climatisé), DH 828,4 → 496,2 °C.h ; bypass de l'échangeur supprimé pendant le rafraîchissement (éq. 493 : 3 057 → 1 812 h) ; pompe d'été de quelques kWh comprise dans les auxiliaires de ventilation (test `humidification_de_bout_en_bout` de `crates/thbce-io/tests/humidification.rs`)."
meteo = "ademe"

[tolerances]
defaut = 0.005
