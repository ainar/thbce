description = "Hôtel d'exemple (tests/cas/hotel-pac-ademe : parties nuit, 900 m², et jour, 300 m², météo ouverte ADEME, Tours, H2b), climatisé, dont le plancher chauffant et les pompes à chaleur air / eau sont remplacés par une boucle d'eau (fiche 8.15) : dix pompes à chaleur sur boucle d'eau pour la partie nuit et quatre pour la partie jour (unités intérieures soufflant l'air, réseaux fictifs ; eau de boucle / air recyclé en chauffage, eau / air en refroidissement, valeurs pivot déclarées COP 4,6 et EER 4,2, 2 kW absorbés, compresseur à puissance variable ; boucle à température sinusoïdale de 18 °C en février à 30 °C, pompes de boucle de 40 W à la demande), boucle maintenue en température par six pompes à chaleur air extérieur / eau (celles de tests/cas/hotel-pac-ademe, θmax_rech_BE 35 °C) et une tour de refroidissement humide (approche de 5 K, consigne 16 °C, 30 m³/h, pompes de 400 W et ventilateurs de 600 W). Les deux parties changent de saison les mêmes jours : la boucle ne transfère rien (éq. 967), les PAC air / eau fournissent le froid rejeté par les PAC de la boucle en chauffage et la tour la chaleur rejetée en refroidissement. Valeurs de saisie illustratives. Résultat non réglementaire."
