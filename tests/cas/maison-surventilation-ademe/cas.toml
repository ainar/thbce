description = "Variante de tests/cas/maison-double-flux-ademe dont la VMC double flux porte un rafraîchissement nocturne par surventilation mécanique en période d'été seulement (§6.12, type 1) : période nocturne de 22 h à 6 h (heures légales au début du pas de temps), déclenchement à 25 °C et arrêt à 22 °C de température opérative, air neuf entre 12 °C et θop,act − 2 K ; 400 m³/h par bouche (reprise et soufflage) et 80 + 80 W de ventilateurs en surventilation. Valeurs de saisie illustratives. Résultat non réglementaire."
source = "aucune : valeurs du moteur au lot 1-ven6 (19 novembre 2026), figées pour détecter les régressions ; ce n'est pas un cas de référence. Recoupements à la main : Bbio identique à l'exemple double flux (système conventionnel du §6.1, la fiche 6.12 ne concerne que Th-C et Th-D) ; consommation des ventilateurs = 35 W × 8 760 h + nbh_rafnoc(Th-C) × (160 − 35) W (éq. 779 et 780), soit 306,6 + 536 × 0,125 = 373,6 kWh ; surface de conduit de la maison inchangée (formule de la maison, éq. 421, lecture Q230 point 3)."
meteo = "ademe"
