source = "aucune : valeurs attendues calculées à la main. Débits du Bbio, §6.2.3.2.2.2 éq. 403 : (180 × 14 + 90 × 154)/168 = 97,5 m³/h repris et soufflé (les deux sens sont saisis, décision Q36). Débits du projet, par bouche : Cdep = 1,30 par défaut (tableau 58), Dugd = 14 h par défaut (tableau 57) : qdep = 1,3 × 97,5 = 126,75 m³/h ; surface de conduit par défaut en maison, éq. (421) à (423) : 96,44 × 0,05 = 4,822 m² sur chaque circuit ; fuites, éq. (419) et (420), classe A : 3600 × 0,027·10⁻³ × 4,822 × 80^0,667 = 8,715 m³/h ; Ratfuitevc = 0,25 (tableau 60) : qspec = 126,75 + 0,25 × 8,715 = 128,93 m³/h ; qcond = 135,46 m³/h. Ventilateurs, éq. (390) à (394) : 2 × (45 × 14 + 15 × 154)/168 = 35 W, soit 35 × 8 760 = 306,6 kWh/an et 3,18 kWh/m². Ce n'est pas un cas de référence."
