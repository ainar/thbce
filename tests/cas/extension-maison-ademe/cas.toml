description = "Extension horizontale de 60 m² (SHAB) d'une maison individuelle, en H2b (station de Tours, météo ouverte ADEME), décrite seule (fiche 4.4, FA03 v2) : un niveau de 10 × 6 m adossé par sa façade nord à la maison existante chauffée (paroi mitoyenne, non saisie), murs, toiture et plancher de la maison d'exemple (tests/cas/maison-climat-ademe), baies de 6 m² au sud et 1,5 m² à l'ouest, VMC simple flux hygroréglable propre (8/16 W), panneaux rayonnants électriques (5 × 1 kW) et chauffe-eau électrique de 100 L (1,2 kW) neufs ; permis de 2025. Valeurs de saisie illustratives. Exigences calculées à la main (annexe de l'article R. 172-4, chapitre III, maisons, Smoylgt = 60 m², Q87) : Bbio_max = 63 × (1 + (49 − 0,49 × 60)/63) = 82,6 ; Mcsurf_moy = (49,5 − 0,55 × 60)/55 = 0,3 : Cep_max = 97,5, Cep,nr_max = 71,5, Icénergie_max = 160 × 1,3 = 208 ; DH_max = 1 250. Régime : extension de maison strictement entre 50 et 80 m², exigences alternatives de l'article 50-3, II (Bbio et DH ; Q86, Q88). Résultat non réglementaire."
source = "aucune : exigences calculées à la main (voir la description) ; indicateurs du moteur sur la météo ADEME. Ce n'est pas un cas de référence."
meteo = "ademe"
