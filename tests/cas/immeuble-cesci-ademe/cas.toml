description = "Immeuble d'exemple (tests/cas/immeuble-collectif-ademe : R+3, 12 logements, SHAB 720 m²) dont l'ECS est produite par un chauffe-eau solaire collectif individualisé (CESCI, lot 7c, fiche 9.16) au lieu du ballon collectif électrique de 1 000 L : champ de 18 m² de capteurs plans vitrés (1,5 m² par logement) au sud, inclinés à 45°, sans masque, performances par défaut du tableau 293 (η0 = 0,6, a1 = 6 W/(m².K), a2 = 0), Kθ = 0,92 ; boucle collective à échangeurs ((UA)hx conventionnel 100·A = 1 800 W/K), (UA)te = 5 W/K, (UA)ti = 8 W/K, pompe de 120 W, régulation sur l'ensoleillement (éq. 1981, Isrmin conventionnel de 200 W/m²) ; un ensemble de 12 ballons individuels de 150 L (pertes par défaut du tableau 282, « autres ballons », 2,75 W/K), θmax = 90 °C, en volume chauffé, échangeur solaire en zone basse ; appoint électrique intégré de 1,5 kW par ballon en zone 3 (faux = 0,4, sonde en zone 3, fonctionnement permanent, consigne de 55 °C). Réseau d'ECS intergroupe « aucun » : les distributions du groupe sont reliées au CESCI. Météo ouverte ADEME (station de Tours, zone H2b) : énergie solaire 8 116 kWh (451 kWh/m²), appoints 12 766 kWh, pompe 250 kWh ; électricité d'ECS 13 016 kWh contre 18 339 kWh avec le ballon collectif. Sur la météo réglementaire : 7 092 kWh solaires (394 kWh/m², 42,7 % des besoins d'ECS de 16 600 kWh), électricité d'ECS 13 824 kWh contre 18 357 kWh (−24,7 %). Valeurs de saisie illustratives. Résultat non réglementaire."
source = "aucune : valeurs du moteur (lot 7c), sans cas de référence. Contrôles indépendants dans crates/thbce-io/tests/solaire_collectif.rs : bilans exacts des ballons (variation du stock), électricité d'ECS = appoints + pompe, ordre de grandeur de la productivité et de la couverture."
