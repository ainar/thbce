description = "Variante de l'exemple `bureaux-cta-ademe` (usage 3, 1 000 m², une zone, un groupe ; météo ouverte ADEME, Tours, zone H2b) dont la centrale devient une centrale de traitement d'air à débit variable (type 4) pourvue d'une batterie chaude régulée sur la charge (mode actif, §6.3.3.5) : soufflage nominal à 32 °C aux bouches, énergie fournie par la chaudière gaz par un réseau de CTA fictif (fiche 8.11, éq. 940). Les radiateurs sont remplacés par l'émetteur contenu dans les bouches de soufflage de la centrale (soufflage d'air chaud, `centrale`), dont la demande passe à la centrale et non au réseau du groupe (lecture Q95). Sans batterie de préchauffage (types 1 et 2 seulement). Reste de la saisie identique. Valeurs de saisie illustratives. Résultat non réglementaire."
source = "aucune : valeurs du moteur au lot 1-ven2 (18 novembre 2026), mises à jour au lot 1-ven3 (sécurité antigel recalculée aux débits du mode actif, `q_ag_kwh` 11,0 → 10,4 et 11,7 → 11,2, Q95 point 11), figées pour détecter les régressions ; ce n'est pas un cas de référence. Recoupements : demande nulle sur le réseau de distribution du groupe ; énergie de la batterie chaude en calcul des consommations (23 386,9 kWh) proche de la demande de l'émetteur (22 363,1 kWh) ; chaudière exactement égale à batterie + antigel (test `mode_actif_de_bout_en_bout`), l'écart venant du débit du mode actif plus fort que celui de la zone neutre et des pertes des conduits hors volume chauffé ; consommation de gaz de la chaudière cohérente avec cette demande ; fonctions du mode actif vérifiées à la main (test `mode_actif_a_la_main` de `crates/thbce-core/src/ventilation/cta_et_double_flux.rs`) ; avec des puissances de ventilateurs égales dans tous les régimes, consommation exactement égale à la puissance × 8 760 h malgré le mode actif (éq. 614, test `consommation_des_ventilateurs_a_la_main` de `crates/thbce-io/tests/cta_mode_actif.rs`)."
meteo = "ademe"

[tolerances]
defaut = 0.005
