description = "Variante de tests/cas/maison-double-flux-ademe dont l'air neuf de la VMC double flux traverse une batterie eau/air reliée à un puits hydraulique (fiche 6.9) : conduit de 120 m, diamètre intérieur 32 mm, épaisseur 3 mm, conductivité 0,4 W/(m.K), enterré à 1,5 m dans un sable humide ; pompe de 1,5 m³/h et 80 W, gestion sur les températures extérieure et d'eau, arrêt au-dessus de 15 °C en période de chauffage et en dessous de 20 °C sinon ; batterie de 0,7 kW en préchauffage et en prérefroidissement. Valeurs de saisie illustratives. Résultat non réglementaire."
source = "aucune : valeurs du moteur au lot 1-ven9 (19 novembre 2026), figées pour détecter les régressions ; ce n'est pas un cas de référence. Recoupements à la main : Bbio identique à l'exemple double flux (le puits n'entre pas dans le Bbio), consommation des auxiliaires de ventilation = 306,6 kWh du double flux + pompe (80 W × nombre d'heures de marche en Th-C, éq. 748), soit 675,0 kWh ; efficacité du capteur εsol-eau = 1 − exp(−3600·Ug·L/(Qmax·ρ·Cp)) avec Qmax en m³/h (Q233) ; énergie échangée dans la batterie restituée par `puits_hydraulique` (préchauffage et prérafraîchissement) pour Th-D et Th-C."
meteo = "ademe"
