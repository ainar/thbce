description = "Restaurant en continu (usage 13, 18 heures par jour, 7 jours sur 7) de 400 m² utiles de plain-pied (3,5 m de haut, 15 % de baies à volets extérieurs motorisés, famille « restauration » des protections mobiles), sur la météo ouverte ADEME (station de Tours, zone H2b, Indre-et-Loire, 80 m) : ventilation simple flux par extraction (4 000 m³/h en occupation, 200 m³/h en inoccupation ; ventilateur de 1 400 W puis 140 W), huit pompes à chaleur air extérieur/eau et plancher chauffant, ECS par un chauffe-eau électrique de 500 L, éclairage par locaux du tableau 78 de l'usage 13 aux parts du classeur des scénarios : salle de restaurant (70 %) et cuisine (20 %) sur interrupteur, local de service (10 %) à détection de présence. Ni ascenseur ni parking. Exigences d'un permis déposé en septembre 2026, catégorie 1 de contraintes extérieures, classe de bruit BR1. Valeurs de saisie illustratives. Résultat non réglementaire."
