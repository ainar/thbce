description = "Petit immeuble de bureaux (usage 3) R+2 de 1 000 m² utiles en une zone et un groupe (emprise de 28 m × 12 m, 9,6 m de haut, 186 m² de baies à volets motorisés), sur la météo ouverte ADEME (Tours, zone H2b) : ventilation simple flux par extraction (3 000 m³/h en occupation avec détection d'utilisation, Crdbnr = 0,9 ; 300 m³/h en inoccupation ; ventilateur de 900 W puis 90 W), chaudière gaz à condensation de 120 kW et radiateurs à eau, trois chauffe-eau électriques de 15 L (production conventionnelle de la fiche 9.24), éclairage par locaux : bureaux standards à 6 W/m² avec gradation, détection d'absence et gestion fractionnée, salles de réunion à 8 W/m² sur interrupteur, circulations et sanitaires à détection de présence. Ni ascenseur ni parking. Exigences d'un permis déposé en 2025, catégorie 1 de contraintes extérieures, classe de bruit BR1. Valeurs de saisie illustratives. Résultat non réglementaire."
source = "aucune : valeurs du moteur au lot 0a (17 novembre 2026), figées pour détecter les régressions ; ce n'est pas un cas de référence. Recoupements à la main : surface de référence 1 000 m² (SU, éq. 2376) ; débits conventionnels du Bbio 4 × 1 000 = 4 000 m³/h en occupation (tableau 56-1) ; ECS a = 1,25 L/(m².semaine) (tableau 277), corr-e = 0,95 × (1 − 0,5 × 0,05) = 0,9263 (tableaux 273 à 275) ; débit repris en occupation 3 000 × 0,9 × 1,15 = 3 105 m³/h plus 0,75 × les fuites du réseau (classe par défaut, 150 m² de conduits, 250 Pa : 1 449 m³/h), soit 4 191,9 m³/h ; ventilateurs : 900 W pendant les 2 610 h de ventilation en occupation et 90 W le reste de l'année, soit 2 902,5 kWh."
