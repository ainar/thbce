description = "Variante de tests/cas/bureaux-cta-puits-climatique-ademe dont l'air neuf de la centrale de traitement d'air traverse une batterie eau/air reliée à un puits hydraulique (fiche 6.9) : conduit de 300 m, diamètre intérieur 40 mm, épaisseur 3 mm, conductivité 0,4 W/(m.K), enterré à 2,5 m dans une argile humide ; pompe de 6 m³/h et 150 W gérée sur la température extérieure (arrêt au-dessus de 12 °C en période de chauffage, en dessous de 22 °C sinon) ; efficacité de la batterie par défaut (0,65, éq. 408). Valeurs de saisie illustratives. Résultat non réglementaire."
source = "aucune : valeurs du moteur au lot 1-ven9 (19 novembre 2026), figées pour détecter les régressions ; ce n'est pas un cas de référence. Recoupements à la main : Bbio identique à l'exemple sans puits (le puits n'entre pas dans le Bbio) ; consommation de la pompe = 150 W × nombre d'heures de marche en Th-C (éq. 748) ; efficacité par défaut signalée dans `valeurs_par_defaut`."
