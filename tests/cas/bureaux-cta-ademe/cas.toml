description = "Variante de l'exemple de bureaux (usage 3, 1 000 m², une zone, un groupe) dont la ventilation simple flux est remplacée par une centrale de prétraitement d'air à débit constant (type 2, §6.3) sur la météo ouverte ADEME (Tours, zone H2b) : une bouche de soufflage et une bouche de reprise de 5 000 m³/h en mode actif, 3 000 m³/h en zone neutre en occupation (taux d'air neuf minimal 0,6) et 300 m³/h en inoccupation, Cdep = 1,15 ; ventilateurs de 1 400 + 1 600 W en mode actif, 800 + 900 W en zone neutre en occupation, 120 + 140 W en inoccupation ; plage de fonctionnement en tout air neuf de 12 à 18 °C, régulation optimisée du taux d'air neuf ; échangeur à plaques d'efficacité certifiée 0,75 avec bypass et sécurité antigel ; batterie de préchauffage à 16 °C sous 10 °C extérieurs ; préchauffage et antigel fournis par la chaudière gaz par un réseau de CTA fictif (fiche 8.11). Reste de la saisie identique à l'exemple simple flux. Valeurs de saisie illustratives. Résultat non réglementaire."
source = "aucune : valeurs du moteur au lot 1-ven (18 novembre 2026), figées pour détecter les régressions ; ce n'est pas un cas de référence. Recoupements à la main : Bbio identique à celui de l'exemple simple flux (système conventionnel du §6.1) ; débits du mode actif restitués 5 000 × 1,15 = 5 750 m³/h plus les fuites du réseau (classe par défaut, 150 m² de conduits par bouche, 250 Pa : 1 449,2 m³/h), soit 7 199,2 m³/h vus par le ventilateur et 5 750 + 0,75 × 1 449,2 = 6 836,9 m³/h reçus par le groupe ; θs,ech,rep,LIM = 0 °C (tableau 62, échangeur à plaques en non résidentiel) ; consommation des ventilateurs comprise entre 260 W et 3 000 W toute l'année (2 277,6 et 26 280 kWh) ; avec des puissances égales dans tous les régimes, consommation exactement égale à la puissance × 8 760 h (test `consommations_a_la_main` de `crates/thbce-io/tests/cta.rs`)."
meteo = "ademe"

[tolerances]
defaut = 0.005
