description = "Variante de tests/cas/maison-double-flux-ademe dont l'air neuf de la VMC double flux traverse un puits climatique (fiches 6.8, 6.10 et 6.11) : 2 conduits de 30 m, diamètre intérieur 0,2 m, épaisseur 5 mm, conductivité 0,4 W/(m.K), enterrés à 2 m dans un sable humide ; bypass du puits selon les températures (consignes d'hiver 15 °C extérieur et 24 °C intérieur, d'été 12 °C et 22 °C). Valeurs de saisie illustratives. Résultat non réglementaire."
source = "aucune : valeurs du moteur au lot 1-ven8 (19 novembre 2026), figées pour détecter les régressions ; ce n'est pas un cas de référence. Recoupements à la main : Bbio identique à l'exemple double flux (la fiche 6.11 exclut le puits du Bbio, §6.11.3), consommation des ventilateurs identique (306,6 kWh : le puits n'a pas de ventilateur propre, Q231) ; efficacité du puits calculée avec les éq. (723) à (727) pour un débit de 135,46 m³/h à 1,2 kg/m³ (0,0452 kg/s) et θext = 5 °C : par conduit v0 = 0,5890 m/s, hi = 4,164 W/(m².K), Ug = 2,490 W/(m.K), ε = 0,9625 (θan = θext + ε × (θsol − θext)) ; énergie échangée dans le puits restituée par `puits_climatique` (préchauffage et prérafraîchissement) pour Th-D et Th-C."
meteo = "ademe"
