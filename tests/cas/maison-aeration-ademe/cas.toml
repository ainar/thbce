description = "Maison d'exemple (tests/cas/maison-double-flux-ademe) en aération par ouverture des fenêtres (fiche 6.7), sur la météo ouverte ADEME (station de Tours, zone H2b) : mêmes bouches que le double flux (180 m³/h en pointe, 90 m³/h en base, reprise et soufflage), sans ventilateur ni conduit. Résultat non réglementaire."
source = "aucune : valeurs attendues calculées à la main pour les débits. Débits du Bbio inchangés (§6.2.3.2.2.2 éq. 403 : (180 × 14 + 90 × 154)/168 = 97,5 m³/h repris et soufflé, décision Q36) : le Bbio vaut celui du double flux (56,8 points). Débits du projet, par groupe : Cdep = Cfenb = 1,7 (§6.2.3.3.1, note 1), Crdbnr = 1, Kres = 0 (tableau 59, cas de l'aération) : qsoufflé = 1,7 × 97,5 = 165,75 m³/h, débit repris opposé (éq. 163) ; aucune fuite, donc le débit vu par le ventilateur est identique ; aucun ventilateur : 0 W et 0 kWh. Q98. Ce n'est pas un cas de référence."
meteo = "ademe"

# Facteurs solaires des parois opaques (`sf_c_k`, `sf_e_k` du catalogue), calculés selon les
# règles Th-Bat 2020 (29 avril 2026), fascicule « Parois opaques », §4.3.1.3.1, formule 259 :
#   Sp-C = αp · Up-C · Rse-C   et   Sp-E = αp · Up-E · Rse-E,
# avec Rse-C = 0,04 et Rse-E = 0,07 m².K/W (tableau 67) et 1/Up-E = 1/Up-C + 0,03 (formule 260).
# αp = 0,6 : valeur par défaut de la catégorie « moyen » (rouge sombre, vert clair, bleu clair,
# gris clair), tableau 66.
#   mur (Up-C = 0,20)     : Sp-C = 0,6 × 0,20 × 0,04 = 0,0048 ;
#                           Up-E = 1/(5 + 0,03) = 0,19881 ; Sp-E = 0,6 × 0,19881 × 0,07 = 0,00835.
#   toiture (Up-C = 0,12) : Sp-C = 0,6 × 0,12 × 0,04 = 0,00288 ;
#                           Up-E = 1/(8,3333 + 0,03) = 0,11957 ; Sp-E = 0,6 × 0,11957 × 0,07 = 0,00502.
#   plancher bas : non exposé au rayonnement, 0.
