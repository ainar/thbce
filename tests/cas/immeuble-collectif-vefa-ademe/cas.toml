description = "Variante de tests/cas/immeuble-collectif-ademe (12 logements, météo ouverte ADEME, Tours, H2b) livrée sans chauffage, celui-ci relevant des travaux réservés par l'acquéreur (VEFA, arrêté du 28 octobre 2019) : la génération à effet Joule, les panneaux rayonnants et leurs réseaux sont remplacés par le chauffage par défaut de la fiche 8.33 (`chauffage_par_defaut_vefa`, 30 kW pour l'immeuble, hauteur sous plafond 2,5 m), que le moteur développe en un générateur à effet Joule de type 500 sans priorité, des réseaux fictifs sans pertes et un convecteur à soufflage d'air chaud de classe C (0,4 K, lecture Q251), variation temporelle certifiée de 1,8 K, sans pertes au dos ni ventilateur (tableaux 261 à 266). Valeurs de saisie illustratives. Résultat non réglementaire."
