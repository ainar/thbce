description = "Maison d'exemple (tests/cas/maison-climat-ademe) chauffée et refroidie par une pompe à chaleur air/air réversible sur la météo ouverte ADEME (station de Tours, zone H2b) : unités intérieures soufflant l'air (classes B2 en chaud et B en froid, variation temporelle par défaut avec arrêt total), ventilateurs à régulation automatique avec arrêt (30, 20 et 10 W ; 600, 400 et 200 m³/h), réseaux fictifs (détente directe) ; générateur thermodynamique réversible air extérieur / air recyclé (§8.23) à compresseur à puissance variable (LRcontmin = 0,4 et CcpLRcontmin = 1 par défaut), valeurs pivot déclarées : COP 4,0 à 7 °C extérieur et 20 °C intérieur, soit 0,8 × 4,0 = 3,2 utile, EER 3,5 à 35 °C extérieur et 27 °C intérieur, soit min(0,8 × 3,5 ; 2,7) = 2,7 utile, 1,5 kW absorbés dans les deux modes ; auxiliaires à charge nulle par défaut (Taux = 0,02). Production d'ECS de la maison d'exemple (ballon électrique de 200 L). Valeurs de saisie illustratives. Résultat non réglementaire."
source = "aucune : le Bbio et les grandeurs d'enveloppe et de ventilation sont ceux de la maison d'exemple, le calcul du Bbio ne dépendant pas des systèmes (§8.1.3.1). Ce n'est pas un cas de référence."
