description = "Variante de tests/cas/maison-chaudiere-gaz-ademe sans ballon : chauffage (plancher chauffant à eau) et ECS instantanée assurés par deux chaudières gaz à condensation « chauffage et ECS » de 12 et 24 kW (§8.19, type 102, valeurs par défaut), gérées en alternance (§8.17.3.7.2.3.4, éq. 1047 à 1052) : la chaudière de 24 kW, appelée en premier, est coupée après 20 heures (« Nbasculement_init ») où la demande tient dans les 12 kW de la suivante, puis remise en service quand la demande les dépasse. Puissances illustratives. Résultat non réglementaire."
