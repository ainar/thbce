description = "Variante de tests/cas/maison-pac-air-air-ademe (unités intérieures soufflant l'air, réseaux fictifs) où la pompe à chaleur électrique est remplacée par une pompe à chaleur réversible à moteur gaz air extérieur / air recyclé (§8.25, type 504) : en chauffage, GUE pivot déclaré 1,5 à 7 °C extérieur et 20 °C intérieur, soit min(0,8 × 1,5 ; 1,4) = 1,2 utile ; en refroidissement, EER pivot par défaut 0,8 × 1,25 = 1,0 ; 10 kW de gaz au pivot dans les deux modes. Valeurs par défaut de la fiche, signalées : moteur en cycles marche-arrêt, auxiliaires de l'unité extérieure 1,2 × 3 % du gaz au pivot (Q142), unités intérieures 6 % (éq. 1369), Paux0 = 0,12 kW ; GUE et puissance gaz constants sous θam,ms = −3 °C (Q141) ; consommation de gaz avec les irréversibilités des cycles (Q143). ECS de la maison d'exemple (ballon électrique de 200 L). Valeurs de saisie illustratives. Résultat non réglementaire."
source = "aucune : calcul du moteur, fiche 8.25 relue sur les p. 890 à 911 de l'annexe III (lectures Q140 à Q144). Ce n'est pas un cas de référence."
