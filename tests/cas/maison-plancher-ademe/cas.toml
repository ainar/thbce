description = "Maison d'exemple (tests/cas/maison-climat-ademe) chauffée par un plancher chauffant à eau sur la météo ouverte ADEME (station de Tours, zone H2b) : plancher de classe A (Pemconv = 0,5, tableau 85), variation temporelle par défaut avec arrêt total (1,8 K, tableau 87), pertes au dos Ri·Ue = 0,15 × 0,15 = 0,0225 (éq. 795 ; Ri, résistance entre les tubes et l'intérieur résistance superficielle comprise, et Ue, coefficient du plancher bas de l'exemple), réseau hydraulique du groupe à débit constant et loi d'eau (départ de dimensionnement 35 °C, écart nominal 5 K, 0,7 m³/h, circulateur à vitesse constante de 15 W, 20 m de tubes de distribution en volume chauffé à 0,2 W/(m.K)), réseau intergroupes hydraulique individuel de longueur nulle sans circulateur (note du §8.9.3.5). Valeurs de saisie illustratives. Résultat non réglementaire."
source = "aucune : le Bbio et les grandeurs d'enveloppe et de ventilation sont ceux de la maison d'exemple, le calcul du Bbio ne dépendant pas des émetteurs (§8.1.3.1). Ce n'est pas un cas de référence."
