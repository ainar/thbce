description = "Maison d'exemple (tests/cas/maison-climat-ademe) chauffée par un plancher chauffant à eau sur la météo ouverte ADEME (station de Tours, zone H2b) : plancher de classe A (Pemconv = 0,5, tableau 85), variation temporelle par défaut avec arrêt total (1,8 K, tableau 87), pertes au dos Ri·Ue = 0,15 × 0,15 = 0,0225 (éq. 795 ; Ri, résistance entre les tubes et l'intérieur résistance superficielle comprise, et Ue, coefficient du plancher bas de l'exemple), réseau hydraulique du groupe à débit constant et loi d'eau (départ de dimensionnement 35 °C, écart nominal 5 K, 0,7 m³/h, circulateur à vitesse constante de 15 W, 20 m de tubes de distribution en volume chauffé à 0,2 W/(m.K)), réseau intergroupes hydraulique individuel de longueur nulle sans circulateur (note du §8.9.3.5) ; génération en cascade à la température de ses réseaux : pompe à chaleur air extérieur / eau (§8.23) à compresseur à puissance variable (LRcontmin = 0,4 et CcpLRcontmin = 1 par défaut, Taux = 0,02 par défaut), six valeurs certifiées aux températures aval de 32,5 et 42,5 °C et amont de −7, 2 et 7 °C (COP 4,5 et 1,35 kW absorbés au point pivot, 7 °C et 32,5 °C), puis appoint électrique à effet Joule de 3 kW ; ECS par un chauffe-eau thermodynamique sur air extérieur de 200 L décrit par son essai NF EN 16147 (§9.22 : cycle L, th = 8 h, Pes = 28 W, COPDHW = 2,7, θ'WH = 53 °C, auxiliaires compris, certifié), identifié par le moteur (UAs = 1,875 W/K, COP pivot 2,745, 327 W absorbés). Valeurs de saisie illustratives. Résultat non réglementaire."
source = "aucune : le Bbio et les grandeurs d'enveloppe et de ventilation sont ceux de la maison d'exemple, le calcul du Bbio ne dépendant pas des émetteurs (§8.1.3.1). Ce n'est pas un cas de référence."
meteo = "ademe"
