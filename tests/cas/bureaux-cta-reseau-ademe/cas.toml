description = "Variante de l'exemple de bureaux (usage 3, 1 000 m², une zone, un groupe) dont la ventilation simple flux est remplacée par une centrale de prétraitement d'air à débit constant (type 2, §6.3) sur la météo ouverte ADEME (Tours, zone H2b) : une bouche de soufflage et une bouche de reprise de 5 000 m³/h en mode actif, 3 000 m³/h en zone neutre en occupation (taux d'air neuf minimal 0,6) et 300 m³/h en inoccupation, Cdep = 1,15 ; ventilateurs de 1 400 + 1 600 W en mode actif, 800 + 900 W en zone neutre en occupation, 120 + 140 W en inoccupation ; plage de fonctionnement en tout air neuf de 12 à 18 °C, régulation optimisée du taux d'air neuf ; échangeur à plaques d'efficacité certifiée 0,75 avec bypass et sécurité antigel ; batterie de préchauffage à 16 °C sous 10 °C extérieurs ; préchauffage et antigel fournis par la chaudière gaz par un réseau de CTA hydraulique à température de départ constante de 60 °C, débit constant de 1 m³/h, circulateur de 40 W, 20 m de canalisation en volume chauffé (Umoyen 0,2 W/(m.K)) (fiches 8.11 et 8.12). Reste de la saisie identique à l'exemple simple flux. Valeurs de saisie illustratives. Résultat non réglementaire."
source = "aucune : valeurs du moteur au lot 1-emi (19 novembre 2026), figées pour détecter les régressions ; ce n'est pas un cas de référence. Recoupements à la main : variante de bureaux-cta-ademe dont seul le réseau de CTA change ; Bbio identique ; pertes du réseau et auxiliaire du circulateur calculés à la main dans les tests de reseaux_cta.rs (chauffage 10 000 Wh : Δθ 4,3078 K, pertes en volume chauffé 75,692 Wh)."
