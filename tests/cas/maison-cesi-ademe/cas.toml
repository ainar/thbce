description = "Maison d'exemple (tests/cas/maison-climat-ademe) dont l'ECS est produite par un chauffe-eau solaire individuel (lot 7b, §9.14 et §9.15) : 4 m² de capteurs plans vitrés orientés au sud, inclinés à 45°, sans masque, performances par défaut du tableau 293 (η0 = 0,6, a1 = 6 W/(m².K), a2 = 0), Kθ = 0,92 ; boucle à échangeur ((UA)hx conventionnel 100·A = 400 W/K), (UA)te = 1 W/K, (UA)ti = 1,5 W/K, pompe de 40 W (αp = 0,5 et ṁCp = 58·A conventionnels), régulation sur l'écart de température (Δθreg = 1 K en habitation, éq. 1968) ; ballon de 300 L à UAs certifié de 1,9 W/K, θmax = 90 °C, en volume chauffé ; appoint électrique intégré de 2,2 kW en zone 3 (faux = 0,4, sonde en zone 3, fonctionnement permanent, consigne de 55 °C). Météo ouverte ADEME (station de Tours, zone H2b) : énergie solaire transmise au ballon 1 212 kWh, appoint 656 kWh, pompe 64 kWh. Sur la météo réglementaire : 1 076 kWh solaires, 743 kWh d'appoint et 67 kWh de pompe, soit 810 kWh d'électricité d'ECS contre 2 123 kWh avec le ballon électrique de 200 L de la maison d'exemple ; couverture solaire du ballon 59 %. Valeurs de saisie illustratives. Résultat non réglementaire."
